<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register </title>
</head>

<body>
    <h3>Ingresar a la cuenta</h3>
    <p>Ingresa tu correo y contraseña</p>
    <p id="mensaje-error">Ingresa tu correo y contraseña</p>
    <div>
        <input type="email" id="email-input" placeholder="example@example.com">
        <input type="password" id="password-input" placeholder="Ingresa tu contraseña">
        <button id="btn-login">Log in</button>
    </div>
    <div>
        ¿Eres nuevo?
        <button> Register</button>
    </div>

    <script>

        document.getElementById("btn-login").addEventListener("click", () => {
            const email = document.getElementById("email-input").value;
            const password = document.getElementById("password-input").value;

            fetch(`http://127.0.0.1:8000/login`, {
                method: "POST",
                headers: { "Content-type": "application/json" },
                body: JSON.stringify({ email: email, password: password })
            }).then(res => {
                const status = res.status;
                return res.json().then(data => {
                    const mensaje = document.getElementById("mensaje-error");
                    if (status != 200) {
                        mensaje.textContent = data.detail;
                        mensaje.style.display = "block";
                        console.log(data);
                    } else {
                        mensaje.textContent = "Usuario logueado correctamente";
                        mensaje.style.display = "block";
                        localStorage.setItem("usuario", JSON.stringify(data))
                        window.location.href = "index.html"
                    }
                });
            });
        });


    </script>
</body>

</html>
